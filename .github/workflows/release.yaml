name: Publish package on NPM
on:
  release:
    types: [prereleased, released]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: corepack enable
      - run: yarn install
      - run: make build
      - run: yarn npm publish --access public --provenance --tag ${{ github.event.release.prerelease == true && 'beta' || 'latest' }}
