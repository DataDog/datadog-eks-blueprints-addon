name: Publish package on NPM
on:
  release:
    types: [prereleased, released]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate
      - run: yarn install
      - run: make build
      - run: yarn npm publish --tag ${{ github.event.release.prerelease && 'beta' || 'latest' }}
